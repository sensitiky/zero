name: release

# Runs on every push to main (including a merged PR) — auto-bumps the patch version from the
# latest vX.Y.Z tag, tags it, and publishes a GitHub Release with a DMG for it.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no leading v) — dry run, does not publish a release"
        required: true
        default: "0.0.0-test"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LATEST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST" ]; then
            NEW=v0.1.0
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
            NEW="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi
          echo "version=${NEW#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${NEW}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: swift test

      - name: Build Zero.app
        env:
          ZERO_VERSION: ${{ steps.version.outputs.version }}
        run: Scripts/make-app.sh release

      - name: Package DMG
        id: dmg
        run: |
          DMG="build/Zero-${{ steps.version.outputs.version }}.dmg"
          rm -f "$DMG"
          hdiutil create -volname Zero -srcfolder build/Zero.app -ov -format UDZO "$DMG"
          echo "path=$DMG" >> "$GITHUB_OUTPUT"

      # workflow_dispatch is for dry-running the build+package steps above without touching
      # tags/releases — see Gate 3 in TESTING.md. Only an actual push to main tags and publishes.
      - name: Tag and publish release
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" "${{ steps.dmg.outputs.path }}" --generate-notes
